name: CloudShop Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Allure runtime
        uses: actions/cache@v4
        with:
          path: .allure
          key: allure-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Run API and UI tests
        run: mvn --batch-mode clean test -Dheadless=true

      - name: Generate Allure report
        if: ${{ always() }}
        continue-on-error: true
        run: mvn --batch-mode allure:report

      - name: Upload Allure HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 14